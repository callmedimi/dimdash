services:
  dimdash:
    build:
      context: .
      dockerfile: Dockerfile
    image: dimdash:latest
    container_name: dimdash
    restart: unless-stopped
    user: "root"
    ports:
      - "${PORT:-3080}:3080"
    volumes:
      # Persistent storage for YAML configuration, uploads, custom icons & wallpapers
      - ./data:/app/data
      # Mount host Docker daemon socket (read-only) for live container telemetry gauge
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NODE_ENV=production
      - PORT=3080
      - TZ=${TZ:-Asia/Tehran}
      - ADMIN_PIN=1234
      - USER_PIN=5678
    deploy:
      resources:
        limits:
          cpus: '0.50'        # Maximum 50% of 1 CPU core
          memory: 128M        # Ultra-low RAM limit (idle consumption is ~45MB)
        reservations:
          memory: 48M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"       # Prevent logs from filling up server storage
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3080/api/health', (r) => {if (r.statusCode !== 200) process.exit(1);})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
