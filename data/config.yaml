    type: clock_widget
    title: ساعت و تقویم
    calendar_mode: both
    time_format: 24h
    show_seconds: true
    color: "#38bdf8"
    size: normal
  - id: widget-cpu
    server_id: local
    type: cpu_gauge
    title: CPU Core Usage
    color: "#6366f1"
    size: normal
  - id: widget-ram
    server_id: local
    type: ram_gauge
    title: Memory (RAM)
    color: "#10b981"
    size: normal
  - id: widget-disk
