version: 2
settings:
  title: DimDash Homelab
  locale: fa
  calendar: both
  quality: auto
  theme:
    accent_color: "#3f407d"
    glass_opacity: 0.85
    glass_blur: 16
    background_type: image
    background_value: /wallpapers/twilight_pines.jpg
    wallpaper_dim: 10
    card_style: pill
    tile_density: normal
    card_radius: 12
    bg_logo_url: /uploads/1792220583192-Glossy_NOC_Telecom_Logo_with_Persian_Branding.png
    bg_logo_opacity: 44
    bg_logo_position: center
    bg_logo_size: 550px
    bg_logo_repeat: no-repeat
  search:
    enabled: true
    focus_hotkey: /
    instant_filter: true
  displays: []
servers:
  - id: local
    name: Master Node (Local)
    type: local
    color: "#6366f1"
items:
  - id: it_island_widgets
    kind: island
    title: Widgets
    props:
      color: "#38bdf8"
      icon: gauge
      layoutMode: flow
      isCollapsed: false
      density: normal
    acl:
      visibility: public
    rev: 1
  - id: it_w_widget-clock
    kind: widget
    type: clock_widget
    title: ساعت و تقویم
    props:
      color: "#38bdf8"
      size: normal
      align: center
      calendar_mode: both
      time_format: 24h
      show_seconds: true
      server_id: local
    bind:
      server_id: local
    acl:
      visibility: public
    rev: 1
  - id: it_w_widget-cpu
    kind: widget
    type: cpu_gauge
    title: CPU Core Usage
    props:
      color: "#6366f1"
      size: normal
      align: center
      server_id: local
    bind:
      server_id: local
    acl:
      visibility: public
    rev: 1
  - id: it_w_widget-ram
    kind: widget
    type: ram_gauge
    title: Memory (RAM)
    props:
      color: "#10b981"
      size: normal
      align: center
      server_id: local
    bind:
      server_id: local
    acl:
      visibility: public
    rev: 1
  - id: it_w_widget-disk
    kind: widget
    type: disk_gauge
    title: Storage & Disk
    props:
      color: "#f59e0b"
      size: normal
      align: center
      server_id: local
    bind:
      server_id: local
    acl:
      visibility: public
    rev: 1
  - id: it_w_widget-net
    kind: widget
    type: network_traffic
    title: Network Traffic (I/O)
    props:
      color: "#06b6d4"
      size: normal
      align: center
      server_id: local
    bind:
      server_id: local
    acl:
      visibility: public
    rev: 1
  - id: it_w_widget-docker
    kind: widget
    type: docker_stats
    title: Docker Containers
    props:
      color: "#38bdf8"
      size: normal
      align: center
      server_id: local
    bind:
      server_id: local
    acl:
      visibility: public
    rev: 1
  - id: it_w_widget-host
    kind: widget
    type: host_info
    title: Host Telemetry & Uptime
    props:
      color: "#ec4899"
      size: normal
      align: center
      server_id: local
    bind:
      server_id: local
    acl:
      visibility: public
    rev: 1
  - id: it_isl_cat-1792219126039
