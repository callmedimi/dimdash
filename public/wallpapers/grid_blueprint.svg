<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <pattern id="smallGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(0, 195, 255, 0.05)" stroke-width="0.75" />
    </pattern>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#smallGrid)" />
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(0, 195, 255, 0.12)" stroke-width="1.25" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0a121e" />
  <rect width="100%" height="100%" fill="url(#grid)" />
</svg>
